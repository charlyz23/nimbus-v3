name: nimbus
description: Nimbus storm updates by SMS, no mobile data needed.
publish_to: none
version: 3.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  another_telephony: ^0.4.1
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  vector_map_tiles: ^9.0.0-beta.9
  vector_map_tiles_mbtiles: ^1.2.2
  mbtiles: ^0.5.0
  path_provider: ^2.1.5
  vector_tile_renderer: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true